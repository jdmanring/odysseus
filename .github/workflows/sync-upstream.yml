name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"   # 3am UTC daily
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: integration
          fetch-depth: 0        # full history needed for merge and rev-list
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Configure git identity and push credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/odysseus-dev/odysseus.git
          git fetch upstream dev

      - name: Ensure upstream-mirror branch exists locally
        run: |
          git fetch origin upstream-mirror:upstream-mirror || \
          git checkout -b upstream-mirror upstream/dev

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies only
        run: pip install ruff

      - name: Run ingest pipeline (CI mode — syntax + lint, no pytest)
        run: |
          python tooling/sync-upstreams/upstream_ingest_pipeline.py --skip-tests --push
